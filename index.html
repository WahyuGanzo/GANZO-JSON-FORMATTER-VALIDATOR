<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GANZO JSON FORMATTER VALIDATOR</title>
  <link rel="shortcut icon" href="icon.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap');
    body {
        font-family: 'Baloo 2', sans-serif;
    }
</style>
<body class="bg-cover bg-center min-h-screen" style="background-image: url('background.jpg');">
  <div class="backdrop-blur-lg bg-white/20 max-w-4xl mx-auto my-10 p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-red-600 text-center mb-6 drop-shadow-lg">GANZO JSON FORMATTER + VALIDATOR</h1>

    <textarea id="jsonInput" placeholder="Paste atau upload kode JSON kamu disini..." 
      class="w-full h-48 p-4 rounded-xl font-mono text-sm resize-y outline-none focus:ring-2 focus:ring-blue-500"></textarea>

    <div class="flex flex-wrap gap-3 mt-4 items-center">
      <button onclick="document.getElementById('fileInput').click()" 
        class="bg-gray-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-gray-800">
        📁 Upload File
      </button>
      <input type="file" id="fileInput" accept=".json" class="hidden" onchange="handleFileUpload()" />

      <button onclick="clearInput()" 
        class="bg-red-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-red-700">
        🗑️ Hapus
      </button>

      <button onclick="insertExample()" 
        class="bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600">
        📄 Example
      </button>

      <select id="tabOption" class="rounded-md px-3 py-2 bg-white text-sm">
        <option value="4">4 space tab</option>
        <option value="3" selected>3 space tab (default)</option>
        <option value="2">2 space tab</option>
        <option value="compact">Compact</option>
        <option value="1">1 space tab</option>
      </select>

      <select id="specOption" class="rounded-md px-3 py-2 bg-white text-sm">
        <option value="RFC 8259">RFC 8259</option>
        <option value="RFC 7159">RFC 7159</option>
        <option value="RFC 4627">RFC 4627</option>
        <option value="ECMA-404">ECMA-404</option>
        <option value="skip">Skip Validation</option>
      </select>

      <label class="text-white flex items-center gap-1">
        <input type="checkbox" id="fixJson" class="accent-blue-600" /> Fix JSON
      </label>

      <button onclick="processJSON()" 
        class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 ml-auto">
        ⚙️ Proses
      </button>
    </div>

    <div id="resultSection" class="mt-6 hidden">
      <p id="validationInfo" class="text-white font-semibold mb-2"></p>

      <div class="flex gap-3 mb-3">
        <button onclick="copyResult()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
          📋 Copy to Clipboard
        </button>
        <button onclick="downloadResult()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
          ⬇️ Download JSON
        </button>
      </div>

      <pre id="output" class="bg-gray-900 text-green-300 p-4 rounded-xl overflow-x-auto text-sm"></pre>
    </div>
  </div>

  <script>
    function handleFileUpload() {
      const file = document.getElementById('fileInput').files[0];
      if (file && file.type === "application/json") {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('jsonInput').value = e.target.result;
        };
        reader.readAsText(file);
      } else {
        alert("Please upload a valid .json file.");
      }
    }

    function clearInput() {
      document.getElementById('jsonInput').value = '';
      document.getElementById('resultSection').classList.add('hidden');
    }

    function insertExample() {
  const messy = '{"nama":"Ganzo","umur":18,"alamat":{"kota":"Limpung","pos":51271},"telepon":["123-456","789-012"],"active":true,"notes":"some info"}';
  document.getElementById('jsonInput').value = messy;
}


    function fixCommonJsonIssues(text) {
      return text
        .replace(/([\{\[,])(\s*)([a-zA-Z0-9_]+)(\s*):/g, '$1 "$3":') // keys
        .replace(/‘|’|“|”/g, '"') // fancy quotes
        .replace(/,\s*([}\]])/g, '$1') // trailing commas
        .replace(/\/\/.*$/gm, '') // single-line comments
        .replace(/\/\*[\s\S]*?\*\//g, '') // multi-line comments
        .replace(/(\w+):/g, '"$1":'); // ensure all keys in quotes
    }

    function processJSON() {
      const rawInput = document.getElementById('jsonInput').value;
      const fix = document.getElementById('fixJson').checked;
      const tabOpt = document.getElementById('tabOption').value;
      const spec = document.getElementById('specOption').value;

      let jsonText = rawInput;
      if (fix) jsonText = fixCommonJsonIssues(jsonText);

      try {
        const parsed = JSON.parse(jsonText);
        const space = tabOpt === "compact" ? 0 : parseInt(tabOpt);
        const formatted = JSON.stringify(parsed, null, space);

        document.getElementById('output').textContent = formatted;
        document.getElementById('validationInfo').textContent = `✅ Valid (${spec}) using ${tabOpt} tab`;
        document.getElementById('resultSection').classList.remove('hidden');
      } catch (err) {
        document.getElementById('output').textContent = '❌ Invalid JSON:\n' + err.message;
        document.getElementById('validationInfo').textContent = '';
        document.getElementById('resultSection').classList.remove('hidden');
      }
    }

    function copyResult() {
      const output = document.getElementById('output').textContent;
      navigator.clipboard.writeText(output);
      alert('Copied to clipboard!');
    }

    function downloadResult() {
      const blob = new Blob([document.getElementById('output').textContent], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'formatted.json';
      link.click();
    }
  </script>
</body>
</html>
